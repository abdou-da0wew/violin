name: Bug report
description: Report a reproducible problem in Violin.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please search existing issues first and include a minimal reproduction where possible.
  - type: input
    id: version
    attributes:
      label: Violin version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and version
      placeholder: Node.js 22.22.1 / Bun 1.4.4
    validations:
      required: true
  - type: input
    id: integration
    attributes:
      label: Related integration and version
      placeholder: Fastify 5.12.7, or none
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include code and the exact command used. Remove all secrets and personal data.
      render: ts
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Redact tokens, credentials, URLs with secrets, and personal data before posting.
      render: text
